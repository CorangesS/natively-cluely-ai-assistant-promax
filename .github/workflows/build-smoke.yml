name: ProMax Build Smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:electron
      - run: npm run build
      - run: npm run build:electron
      - run: npm run test:promax
      - run: node --test electron/llm/__tests__/SixtySecondRequestTimeout.test.mjs electron/llm/__tests__/LiveDeadlines.test.mjs electron/services/__tests__/ChatStreamGuard.test.mjs electron/services/__tests__/PhoneChatCapture.test.mjs electron/services/__tests__/PhoneMirrorAnonymousLan.test.mjs
